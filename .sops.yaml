# Age public keys for every host that must be able to decrypt secrets/.
# Each host's key is generated at install time:
#   age-keygen -o /var/lib/sops/age.key
# and its public key is printed alongside. Recover it later with:
#   age-keygen -y /var/lib/sops/age.key
#
# To add a new host: uncomment its line below (and in the key group),
# then re-encrypt the secrets file for all holders:
#   sops updatekeys secrets/secrets.yaml
keys:
  - &node1_age age19fxu6v8aj3emj0dnyhama3qtc0g2a2rmngf77at8gyp7v7afa5fszwjcn3
  # TODO: uncomment as each node comes online (fill in its age pubkey):
  # - &node2_age age1...
  # - &node3_age age1...

creation_rules:
  - path_regex: secrets/.*\.yaml$
    key_groups:
      - age:
          - *node1_age
          # - *node2_age
          # - *node3_age
